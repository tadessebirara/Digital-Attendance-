name: alyah_smart_attendance
description: Alyah Smart Attendance - Enterprise Workforce Management

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  intl: ^0.19.0
  socket_io_client: ^2.0.2
  image_picker: ^1.0.7
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^17.0.0
  table_calendar: ^3.0.9
  fl_chart: ^0.66.0
  url_launcher: ^6.2.2
  app_links: ^6.3.2
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  file_picker: ^8.0.0
  uuid: ^4.3.3
  mobile_scanner: ^5.2.3
  flutter_jailbreak_detection: ^1.1.0
  logger: ^2.2.0
  crypto: ^3.0.3
  device_info_plus: ^12.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/icon.png"
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
